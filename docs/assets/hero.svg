<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mini Redis — Mission 5-1</title>
  <desc id="hero-desc">해시맵, 이중 연결 리스트, 최소 힙을 직접 구현하는 Python 저장소. String commands, LRU eviction, heap-based TTL.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d30"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.5" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#hero-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#26354a"/>
  <path d="M64 215H756" stroke="#26354a"/>
  <path d="M64 215H242" stroke="url(#hero-rule)" stroke-width="2"/>
